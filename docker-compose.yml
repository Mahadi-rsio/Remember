# Run from repo root: docker compose up --build
services:
  memory-gateway:
    build:
      context: ./memory-gateway
    image: memory-gateway:local
    container_name: memory-gateway
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ./memory-gateway/.env
    environment:
      SQLITE_PATH: /app/data/memory.db
      HOST: 0.0.0.0
      PORT: "8000"
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  gateway-data:
